services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bubu
      POSTGRES_PASSWORD: bubu
      POSTGRES_DB: bubu_content
    ports:
      - "5432:5432"
    volumes:
      - bubu_postgres:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubu -d bubu_content"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bubu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bubu_postgres:
  bubu_redis:

