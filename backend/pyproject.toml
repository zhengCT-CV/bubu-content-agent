[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bubu-content-agent"
version = "0.1.0"
description = "微信公众号选题、分镜、视觉 Prompt 与复盘的可回溯 Agent 工作台"
requires-python = ">=3.11,<3.13"
dependencies = [
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-deepseek>=0.1,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "mcp>=1.10,<2",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "sse-starlette>=2.1,<4",
  "SQLAlchemy[asyncio]>=2,<3",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

